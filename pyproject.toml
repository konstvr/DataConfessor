[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataconfessor"
version = "0.1.0"
description = "Find the patients at privacy risk before you train a model on their data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Konstantinos Vrettos" }, { name = "Michail E. Klontzas" }]
keywords = ["privacy", "membership inference", "medical imaging", "machine learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "torchvision>=0.15",
    "pillow>=9.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
energy = ["nvidia-ml-py>=12.0"]
perf = ["psutil>=5.9"]

[project.scripts]
dataconfessor = "dataconfessor.cli:main"

[project.urls]
Source = "https://github.com/konstvr/DataConfessor"
Issues = "https://github.com/konstvr/DataConfessor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataconfessor = ["web/*"]
